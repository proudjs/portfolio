name: Copy images into the repo

# Downloads any UXfolio images or files used on the site into public/,
# points the pages at the local copies and saves the result to the same branch.
on:
  push:
    paths: ['src/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/copy-images.mjs
      - name: Save the copies
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Copy images from UXfolio into the repo"
            git push
          else
            echo "Nothing to copy."
          fi
